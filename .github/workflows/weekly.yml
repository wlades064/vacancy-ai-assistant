name: Weekly Vacancy Search

on:
  schedule:
    - cron: '0 11 * * 1'  # каждый понедельник в 11:00 UTC (14:00 по Москве)
  workflow_dispatch:  # позволяет запустить вручную

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 gspread google-auth selenium webdriver-manager gigachat

      - name: Run script
        run: |
          ls -la
          python ./main.py
